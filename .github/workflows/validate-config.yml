name: Validate Config

on:
  pull_request:
    paths:
      - '.github/config/**'
      - '.github/schemas/**'
      - '.github/scripts/render-hub.sh'
      - 'index.html'
      - 'about.html'
      - '.github/scripts/narration-clips.sh'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/config/**'
      - '.github/schemas/**'
      - '.github/scripts/render-hub.sh'
      - 'index.html'
      - 'about.html'
      - '.github/scripts/narration-clips.sh'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate config files
        run: |
          chmod +x .github/scripts/validate-config.sh
          .github/scripts/validate-config.sh .github/config

      - name: Check hub page and README are in sync with repos.json
        run: |
          chmod +x .github/scripts/render-hub.sh
          .github/scripts/render-hub.sh --check
