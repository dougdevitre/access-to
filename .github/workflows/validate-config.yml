name: Validate Config

on:
  pull_request:
    paths:
      - '.github/config/**'
      - '.github/schemas/**'
      - '.github/scripts/build-graph.sh'
      - 'graph.json'
  push:
    branches: [main]
    paths:
      - '.github/config/**'
      - '.github/schemas/**'
      - '.github/scripts/build-graph.sh'
      - 'graph.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate config files
        run: |
          chmod +x .github/scripts/validate-config.sh
          .github/scripts/validate-config.sh .github/config

      - name: Rebuild network graph and check for drift
        run: |
          chmod +x .github/scripts/build-graph.sh
          .github/scripts/build-graph.sh .github/config
          if ! git diff --exit-code graph.json; then
            echo "::error::graph.json is stale — run .github/scripts/build-graph.sh and commit the result"
            exit 1
          fi
